<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2f7fd8">
<title>날씨</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%232f7fd8%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/style.css">
<link rel="stylesheet" href="../shared/ios.css">
<link rel="stylesheet" href="../shared/dark.css">
<style>
html, body { min-height: 100%; }
html { background: linear-gradient(180deg, var(--a, #2f7fd8), var(--b, #6bb2f0)) fixed; min-height: 100%; }
body.sky { color: #fff; background: transparent !important; }
body.sky .mini-time { color: #fff; }
body.sky::after { display: none !important; }
.now { text-align: center; padding-top: calc(48px * var(--s)); }
.now .place { font-size: calc(30px * var(--s)); font-weight: 500; }
.now .temp { font-size: calc(96px * var(--s)); font-weight: 200; letter-spacing: -.04em; line-height: 1; margin-left: .25em; }
.now .cond { font-size: var(--t-head); font-weight: 600; opacity: .9; }
.now .hl { font-size: var(--t-head); font-weight: 600; margin-top: 2px; }
.card { margin-top: calc(22px * var(--s)); background: rgba(255,255,255,.16); border-radius: calc(22px * var(--s)); padding: calc(14px * var(--s)) calc(16px * var(--s)); }
.card h3 { font-size: calc(13px * var(--s)); font-weight: 600; opacity: .7; margin: 0 0 calc(10px * var(--s)); }
.hours { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); row-gap: calc(14px * var(--s)); }
.hours div { display: flex; flex-direction: column; align-items: center; gap: calc(6px * var(--s)); font-weight: 600; font-size: var(--t-body); }
.hours small { font-size: var(--t-sub); opacity: .85; }
.wi { width: calc(30px * var(--s)); height: calc(30px * var(--s)); display: grid; }
.wi svg { width: 100%; height: 100%; }
.days > div { display: grid; grid-template-columns: calc(56px * var(--s)) calc(36px * var(--s)) calc(44px * var(--s)) 1fr calc(44px * var(--s)); align-items: center; gap: calc(10px * var(--s)); padding: calc(10px * var(--s)) 0; font-size: var(--t-body); font-weight: 600; }
.days .lo { opacity: .65; text-align: right; }
.days .hi { text-align: left; }
.bar { position: relative; height: calc(6px * var(--s)); border-radius: 9px; background: rgba(0,0,0,.18); }
.bar i { position: absolute; top: 0; bottom: 0; border-radius: 9px; background: linear-gradient(90deg, #7dd3fc, #fbbf24); }
.upd { text-align: center; font-size: calc(13px * var(--s)); opacity: .75; margin-top: calc(16px * var(--s)); }
.off { text-align: center; padding-top: calc(80px * var(--s)); }
.off p { font-size: calc(17px * var(--s)); opacity: .9; margin: 12px 0 18px; }
.off button { height: calc(50px * var(--s)); padding: 0 calc(24px * var(--s)); border-radius: 99px; background: #fff; color: #1d4f91; font-weight: 700; font-size: calc(17px * var(--s)); }
.bottombar .icon-btn { background: rgba(255,255,255,.22) !important; color: #fff; }
</style>
<script type="module" src="../shared/night.js"></script>
</head>
<body class="sky">
<main class="page" id="main"></main>
<nav class="bottombar"><a class="icon-btn" href="../" aria-label="홈으로" id="back"></a><button class="icon-btn" type="button" aria-label="새로 받기" id="reload"></button></nav>
<script type="module" src="weather.js"></script>
<script type="module" src="../shared/inframe.js"></script>
<script type="module" src="../shared/mini.js"></script>
<script type="module" src="../shared/watch.js"></script>
</body>
</html>
