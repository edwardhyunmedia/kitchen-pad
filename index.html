<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<title>홈</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%23f59e0b%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="shared/style.css">
<link rel="stylesheet" href="shared/faces.css">
<link rel="stylesheet" href="shared/home.css">
<link rel="stylesheet" href="shared/ios.css">
<link rel="stylesheet" href="shared/dark.css">
<script type="module" src="shared/night.js"></script>
</head>
<body class="homeview idle">
<div class="bgl" id="bgl"></div>
<div id="face-layer" class="face-root"></div>
<div class="hint idle-hint">화면을 누르면 앱이 나와요 · 길게 누르면 시계를 바꿔요</div>

<main id="home">
  <div class="hero">
    <div><div class="t" id="h-time">--:--</div><div class="d" id="h-date"></div></div>
    <div class="wx" id="h-wx"></div>
  </div>
  <div class="scroll" id="scroll"><div class="hgrid" id="grid"></div></div>
</main>

<div class="glance" id="glance"></div>
<div class="appview" id="appview"><iframe id="appframe" title="앱" src="about:blank"></iframe></div>
<div class="toast" id="toast"><span id="toast-text"></span><button type="button" id="toast-undo">되돌리기</button></div>

<div class="editbar"><button class="pillbtn" type="button" id="add-btn">+ 추가</button><button class="pillbtn done" type="button" id="done-btn">완료</button></div>

<div class="sheet-back" id="add-sheet">
  <div class="sheet" role="dialog" aria-label="추가">
    <div class="navbar"><span></span><h3>홈 화면에 추가</h3><button class="nav-right" type="button" id="add-close">닫기</button></div>
    <div class="sheet-body"><div class="addlist" id="add-list"></div></div>
  </div>
</div>

<div class="picker" id="picker" role="dialog" aria-label="시계 고르기">
  <div class="ptop"><span>시계 고르기</span><button class="pillbtn done" type="button" id="pick-done">완료</button></div>
  <div class="pstrip" id="pstrip"></div>
  <div class="popts">
    <div class="swatches" id="swatches"></div>
    <div class="toggles"><button class="tg" type="button" id="tg-date">날짜</button><button class="tg" type="button" id="tg-wx">날씨</button><button class="tg" type="button" id="tg-ev">일정</button></div>
  </div>
</div>

<script type="module" src="shared/home.js"></script>
<script type="module" src="shared/watch.js"></script>
</body>
</html>
