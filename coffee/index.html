<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f3f5f9">
<title>커피</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%23f59e0b%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/style.css">
<link rel="stylesheet" href="../shared/ios.css">
</head>
<body>
<main class="page">
  <h1 class="title" style="margin-top:40px">커피</h1>
  <p class="subtitle">레시피를 누르면 타이머가 열려요</p>
  <div class="grid" id="recipes"></div>
</main>

<div class="sheet-back" id="timer-sheet">
  <div class="sheet" role="dialog" aria-label="타이머">
    <div class="detail">
      <div class="d-head" style="padding-top:16px">
        <span class="glyph" id="t-icon"></span>
        <div class="txt"><div class="t1" id="t-title"></div><div class="t2" id="t-sub"></div></div>
      </div>
      <div class="d-main">
        <div><div class="d-step" id="t-step"></div><div class="d-pour" id="t-pour"></div></div>
        <div class="d-sec"><span id="t-sec">0</span><small>초</small></div>
        <div class="capsule" id="t-cap"><div class="fill" id="t-fill"></div></div>
        <div><div class="d-next" id="t-next"></div><div class="dots" id="t-dots" style="margin-top:10px"></div></div>
      </div>
      <div class="controls">
        <button class="round-btn" type="button" aria-label="처음부터" id="t-reset"></button>
        <button class="round-btn main" type="button" aria-label="시작" id="t-play"></button>
        <button class="round-btn" type="button" aria-label="닫기" id="t-close"></button>
      </div>
    </div>
  </div>
</div>

<div class="sheet-back" id="edit-sheet">
  <div class="sheet" role="dialog" aria-label="레시피 편집">
    <div class="navbar"><span></span><h3>레시피 편집</h3><button class="nav-right" type="button" id="edit-done">완료</button></div>
    <div class="sheet-body" id="edit-body"></div>
  </div>
</div>

<nav class="bottombar"><a class="icon-btn" href="../" aria-label="홈으로" id="back"></a><button class="icon-btn" type="button" aria-label="레시피 편집" id="open-edit"></button></nav>
<script type="module" src="coffee.js"></script>
<script type="module" src="../shared/inframe.js"></script>
<script type="module" src="../shared/mini.js"></script>
<script type="module" src="../shared/watch.js"></script>
</body>
</html>
