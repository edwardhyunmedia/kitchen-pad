<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f3f5f9">
<title>약</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%23f59e0b%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/style.css">
<link rel="stylesheet" href="../shared/ios.css">
<style>
.seg { display: inline-flex; background: #f2f2f7; border-radius: 10px; padding: 3px; margin: 0 0 6px; }
.seg button { min-width: 96px; padding: 9px 18px; border-radius: 8px; font-weight: 600; color: var(--ink-2); }
.seg button.on { background: #fff; color: #000; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.hgrp { margin-top: 18px; }
.hrow { display: grid; grid-template-columns: 92px 1fr auto; align-items: center; gap: 12px; padding: 12px 16px; background: #f2f2f7; border-radius: 12px; margin-bottom: 8px; }
.hrow .hd { font-weight: 600; } .hrow .hd small { display: block; color: var(--ink-2); font-weight: 500; font-size: 14px; }
.dots { display: flex; flex-wrap: wrap; gap: 8px; }
.dots span { width: 22px; height: 22px; border-radius: 50%; background: #d1d1d6; }
.dots span.ok { background: var(--green); }
.dots span.miss { background: #fff; box-shadow: inset 0 0 0 3px var(--red); }
.hrow .cnt { color: var(--ink-2); font-weight: 600; font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 16px; color: var(--ink-2); font-size: 14px; margin: 10px 2px 0; align-items: center; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
</style>
</head>
<body>
<main class="page">
  <h1 class="title" style="margin-top:40px">약</h1>
  <p class="subtitle" id="summary"></p>
  <div class="seg" role="tablist"><button type="button" class="on" id="tab-today" role="tab">오늘</button><button type="button" id="tab-hist" role="tab">기록</button></div>
  <div id="people"></div>
  <div id="hist" hidden></div>
</main>

<div class="sheet-back" id="settings">
  <div class="sheet" role="dialog" aria-label="약 설정">
    <div class="navbar"><span></span><h3>약 설정</h3><button class="nav-right" type="button" id="close-settings">완료</button></div>
    <div class="sheet-body" id="settings-body"></div>
  </div>
</div>

<nav class="bottombar"><a class="icon-btn" href="../" aria-label="홈으로" id="back"></a><button class="icon-btn" type="button" aria-label="약 설정" id="open-settings"></button></nav>
<script type="module" src="meds.js"></script>
<script type="module" src="../shared/inframe.js"></script>
<script type="module" src="../shared/mini.js"></script>
<script type="module" src="../shared/watch.js"></script>
</body>
</html>
