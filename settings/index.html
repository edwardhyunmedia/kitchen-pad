<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f2f2f7">
<title>설정</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%23f59e0b%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/style.css">
<style>
body { background: #f2f2f7; }
.page { padding-bottom: 140px; max-width: 760px; }
.bgopts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 16px; }
.bgopt { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 15px; }
.th { width: 100%; aspect-ratio: 9 / 14; border-radius: 14px; border: 3px solid transparent; background-size: cover; background-position: center; position: relative; display: grid; place-items: center; color: var(--ink-2); }
.th svg { width: 32%; height: 32%; }
.bgopt.sel .th { border-color: var(--blue); }
.bgopt.sel span { color: var(--blue); font-weight: 600; }
.th.plain { background: radial-gradient(80% 60% at 0 0, #dde8ff, transparent), radial-gradient(70% 60% at 100% 40%, #f7e2ef, transparent), radial-gradient(90% 60% at 30% 100%, #fcecdc, transparent), #eef0f5; }
.th.add { background: var(--fill); }
input[type="range"] { flex: 1; accent-color: var(--blue); height: 30px; }
.switch { width: 56px; height: 34px; border-radius: 17px; background: rgba(120,120,128,.24); position: relative; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 28px; height: 28px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .2s; }
.switch.on { background: var(--green); }
.switch.on::after { transform: translateX(22px); }
.note { color: var(--ink-2); font-size: 14px; margin: 8px 16px 0; line-height: 1.45; }
select { font: inherit; border: 0; background: none; color: var(--ink-2); text-align: right; }
</style>
</head>
<body>
<main class="page">
  <h1 class="title" style="margin-top:40px">설정</h1>

  <p class="group-label">시계</p>
  <div class="group">
    <div class="row"><span class="label grow">시계 모양</span><a class="row-btn" style="width:auto;color:var(--blue)" href="../?pick" id="face-name"></a></div>
    <div class="row"><span class="label grow">안 만지면 시계로 돌아가기</span>
      <select id="idle"><option value="15">15초</option><option value="30">30초</option><option value="60">1분</option><option value="120">2분</option><option value="300">5분</option></select></div>
  </div>
  <p class="note">메인 시계 화면을 길게 눌러도 바꿀 수 있어요.</p>

  <p class="group-label">배경</p>
  <div class="group">
    <div class="bgopts">
      <button class="bgopt" type="button" data-bg="default"><span class="th plain"></span><span>기본</span></button>
      <button class="bgopt" type="button" data-bg="photo" id="opt-photo"><span class="th" id="photo-th"></span><span>내 사진</span></button>
      <label class="bgopt"><span class="th add" id="pick-th"></span><span>사진 고르기</span><input type="file" accept="image/*" id="file" hidden></label>
    </div>
    <div class="row"><span class="label">흐리게</span><input type="range" min="0" max="40" step="1" id="blur"></div>
    <div class="row"><span class="label">어둡게</span><input type="range" min="0" max="0.6" step="0.02" id="dim"></div>
    <div class="row"><button class="row-btn danger" type="button" id="del-photo">사진 지우기</button></div>
  </div>
  <p class="note">사진은 이 태블릿 안에만 저장돼요. 인터넷으로 보내지 않아요. 사진 시계 모양도 이 사진을 써요.</p>

  <p class="group-label">날씨</p>
  <div class="group">
    <div class="row"><span class="label grow">날씨 보기</span><button class="switch" type="button" id="weather" aria-label="날씨 보기"></button></div>
  </div>
  <p class="note">켜면 날씨를 받아오려고 마포구 위치(좌표)만 날씨 서비스(Open-Meteo)에 보내요. 약 기록, 이름, 사진 같은 다른 정보는 보내지 않아요. 끄면 아무것도 보내지 않아요.</p>

  <p class="group-label">홈 화면</p>
  <div class="group">
    <div class="row"><button class="row-btn danger" type="button" id="reset-layout">앱·위젯 배치 처음대로</button></div>
  </div>
</main>
<nav class="bottombar"><a class="icon-btn" href="../" aria-label="홈으로" id="home-btn"></a></nav>
<script type="module" src="settings.js"></script>
<script type="module" src="../shared/mini.js"></script>
<script type="module" src="../shared/watch.js"></script>
<script type="module" src="../shared/live.js"></script>
</body>
</html>
