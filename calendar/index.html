<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<title>달력</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%23ff3b30%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/style.css">
<link rel="stylesheet" href="../shared/ios.css">
<link rel="stylesheet" href="../shared/dark.css">
<style>
.chead { display: flex; align-items: flex-end; justify-content: space-between; margin-top: calc(40px * var(--s)); }
.chead h1 { margin: 0; }
.chead .subtitle { margin-top: 2px; }
.mnav { display: flex; gap: calc(10px * var(--s)); }
.mnav button { width: calc(44px * var(--s)); height: calc(44px * var(--s)); border-radius: 50%; background: #f2f2f7; display: grid; place-items: center; color: #ff3b30; }
.mnav button svg { width: 50%; height: 50%; }
.mgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); margin-top: calc(18px * var(--s)); row-gap: calc(4px * var(--s)); }
.mgrid .wd { text-align: center; font-size: calc(13px * var(--s)); font-weight: 600; color: var(--label-2); padding-bottom: calc(8px * var(--s)); }
.mgrid .wd:first-child, .day.sun:not(.out) b { color: #ff3b30; }
.day { display: flex; flex-direction: column; align-items: center; gap: calc(4px * var(--s)); padding: calc(4px * var(--s)) 0; background: none; color: inherit; }
.day b { width: calc(40px * var(--s)); height: calc(40px * var(--s)); border-radius: 50%; display: grid; place-items: center; font-size: calc(19px * var(--s)); font-weight: 500; font-variant-numeric: tabular-nums; }
.day.out b { color: var(--label-3); }
.day.sel b { background: #000; color: #fff; }
html.dark .day.sel b { background: #fff; color: #000; }
.day.today b { color: #ff3b30; font-weight: 700; }
.day.today.sel b { background: #ff3b30; color: #fff; }
.day i { width: calc(6px * var(--s)); height: calc(6px * var(--s)); border-radius: 50%; background: transparent; }
.day.has i { background: var(--label-3); }
.agenda { margin-top: calc(22px * var(--s)); }
.agenda h2 { font-size: var(--t-section); font-weight: 700; margin: 0 0 calc(12px * var(--s)); }
.ev { position: relative; display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: calc(14px * var(--s)) calc(16px * var(--s)) calc(14px * var(--s)) calc(26px * var(--s)); background: #f2f2f7; border-radius: calc(18px * var(--s)); margin-bottom: calc(8px * var(--s)); }
html.dark .ev { background: #1c1c1e; }
.ev::before { content: ""; position: absolute; left: calc(12px * var(--s)); top: calc(12px * var(--s)); bottom: calc(12px * var(--s)); width: calc(4px * var(--s)); border-radius: 9px; background: #0a84ff; }
.ev b { font-size: var(--t-body); font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev span { color: var(--label-2); font-size: var(--t-sub); white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; }
.ev span small { display: block; font-size: var(--t-sub); }
.empty2 { color: var(--label-2); font-size: calc(17px * var(--s)); padding: calc(12px * var(--s)) 0; }
.foot { color: var(--label-2); font-size: var(--t-foot); margin-top: calc(14px * var(--s)); }
.connect { display: inline-grid; place-items: center; height: calc(50px * var(--s)); padding: 0 calc(22px * var(--s)); border-radius: 99px; background: #007aff; color: #fff; font-weight: 600; font-size: calc(17px * var(--s)); margin-top: calc(8px * var(--s)); text-decoration: none; }
</style>
<script type="module" src="../shared/night.js"></script>
</head>
<body>
<main class="page">
  <div class="chead"><div><h1 class="title" id="mon"></h1><div class="subtitle" id="yr"></div></div>
    <div class="mnav"><button type="button" id="prev" aria-label="이전 달"></button><button type="button" id="next" aria-label="다음 달"></button></div></div>
  <div class="mgrid" id="grid"></div>
  <section class="agenda" id="agenda"></section>
</main>
<nav class="bottombar"><a class="icon-btn" href="../" aria-label="홈으로" id="back"></a><button class="icon-btn" type="button" aria-label="새로 받기" id="reload"></button></nav>
<script type="module" src="calendar.js"></script>
<script type="module" src="../shared/inframe.js"></script>
<script type="module" src="../shared/mini.js"></script>
<script type="module" src="../shared/watch.js"></script>
</body>
</html>
